[pytest]
# Procurar testes no diretório testes/
testpaths = testes
# Padrões de nome (o projeto usa prefixo em português 'teste_')
python_files = teste_*.py test_*.py
python_classes = Test*
python_functions = test_*
# Marcadores customizados
markers =
    integration: teste de integração end-to-end (mais lento)
